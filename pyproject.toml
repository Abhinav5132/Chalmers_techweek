[project]
name = "skf-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.14.0",
    "numpy>=2.4.6",
    # The robotics library is distributed as pin, not the unrelated pinocchio package.
    "pin>=3.0.0",
    "pin-pink>=4.4.0",
    "dearpygui>=1.11.0",
    "ty>=0.0.83",
    "qpsolvers>=4.0.0",
    "proxsuite>=0.6.0",
    "quadprog>=0.1.12",
]

[tool.ty.analysis]
# pin uses a cmeel .pth hook that ty cannot resolve statically.
allowed-unresolved-imports = ["mujoco.*", "pinocchio", "pinocchio.*", "pink.*"]

[tool.ty.rules]
unresolved-attribute = "ignore"
