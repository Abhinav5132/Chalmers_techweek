[project]
name = "skf-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.14.0",
    "numpy>=2.4.6",
    "pin>=3.0.0",
    "pin-pink>=4.4.0",
    "dearpygui>=1.11.0",
    "ty>=0.0.83",
    "qpsolvers>=4.0.0",
    "proxsuite>=0.6.0",
    "quadprog>=0.1.12",
    "onnxruntime>=1.30.0",
    "pyyaml>=6.0.0",
]


[tool.ty.analysis]
allowed-unresolved-imports = ["mujoco.*", "pinocchio.*", "pink.*", "onnxruntime.*"]

[tool.ty.rules]
unresolved-attribute = "ignore"

