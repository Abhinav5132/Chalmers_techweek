[project]
name = "skf-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.14.0",
    "numpy>=2.4.6",
    # The robotics library is distributed as pin, not the unrelated pinocchio package.
    "pin>=3.0.0",
    "pin-pink>=4.4.0",
    "dearpygui>=1.11.0",
    "ty>=0.0.83",
    "qpsolvers>=4.0.0",
    "proxsuite>=0.6.0",
    "quadprog>=0.1.12",
    "mcp>=1.26,<2",
]

[tool.ty.analysis]
# pin uses a cmeel .pth hook that ty cannot resolve statically.
allowed-unresolved-imports = ["mujoco.*", "pinocchio", "pinocchio.*", "pink.*"]

[tool.ty.environment]
# Pinocchio's binary wheel installs beneath cmeel.prefix (Python 3.11).
extra-paths = [".venv/lib/python3.11/site-packages/cmeel.prefix/lib/python3.11/site-packages"]

[tool.ty.rules]
unresolved-attribute = "ignore"

[dependency-groups]
training = [
    "certifi>=2026.7.22",
    "gymnasium>=1.3.0",
    "matplotlib>=3.11.2",
    "onnxruntime>=1.30.0",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.0",
]

# Preserve upstream inference code; type-check our adapter separately.
[tool.ty.src]
exclude = ["src/pmt_vendor"]
